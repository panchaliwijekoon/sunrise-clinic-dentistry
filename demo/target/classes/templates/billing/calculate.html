<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculate Bill</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #83cdee;
        }
        .container{
            width: 480px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .h1{
           text-align: center;
            color: #1678b8;
            margin-bottom: 30px;
        }
        label{
            display: block;
            margin-bottom: 8px;
            margin-top: 18px;
            font-weight: bold;
            color: #333;
        }
        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus{
            outline: none;
            border-color: #1678b8;
        }
        .button-row{
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button, .home-btn{
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        button{
            background: #1678b8;
            color: #fff;
        }
        button:hover, .home-btn:hover{
            background: #d7e1e7;
        }
        home-btn{
            background: #e8eef2;
            color: #333;
        }
        subtitle{
            text-align: center;
            color: #777;
            margin-top: -20px;
            margin-bottom: 25px;
        }
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #2384c6;
        }
    </style>
</head>
<body>
<div class="container">
   <p class="sub-title">Sunrise Dental Clinic</p>
<h1>Calculate Bill</h1>

<form th:action="@{/billing/calculate}"  method="post">
    <label for="patientName">Patient Name</label>
    <input type="text" name="patientName" id="patientName" placeholder="Enter Patient Name" required>
    <br>
    <label for="treatment">Treatment</label>
    <select id="treatment"  name="treatment"  required>
        <option value="">Select Treatment</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Filling">Filling</option>
        <option value="Extraction">Extraction</option>
        <option value="Root Canal">Root Canal</option>
        <option value="Consultation">Consultation</option>
        </select>
    <br>
    <label for="consultationFee">Consultation Fee(Rs.)</label>
    <input type="number" id="consultationFee" name="consultationFee" step="0.01" min="0" value="0.00">
    <br>

    <label for="amount">Treatment Charge(Rs.)</label>
    <input id="amount" type="number" name="amount" step="0.01" min="0" placeholder="Enter Treatment Charge" required>
    <br>

    <label for="discount">Discount (Rs.)</label>
    <input id="discount" type="number" name="discount" step="0.01" value="0.00" min="0">
    <br>

    <label for="paymentMethod">Payment Method</label>
    <select id="paymentMethod"  name="paymentMethod"  required>
        <option value="Cash">Cash</option>
        <option value="Card">Card</option>
        <option value="Bank Transfer">Bank Transfer</option>
    </select>

    <button type="submit">Calculate Bill</button>

</form>
<br>
<a href="/dashboard">Return Home</a>
</div>
</body>
</html>
