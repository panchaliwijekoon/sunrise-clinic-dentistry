<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e7f6ff, #f7fbff);
        }

        .login-card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1976b8;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2384c6;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2384c6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #176a9e;
        }

        .message {
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 7px;
            text-align: center;
        }

        .error {
            background: #ffe3e3;
            color: #a61b1b;
        }

        .logout {
            background: #ddf6e5;
            color: #176b33;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🦷</div>

    <h1>Sunrise Dental Clinic</h1>

    <div class="subtitle">
        Clinic Management System
    </div>

    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="message logout">
        You have been signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Username</label>
        <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required>

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>

        <button type="submit">Sign In</button>

    </form>

    <div class="footer">
        Authorized staff access only
    </div>

</div>

</body>
</html>
