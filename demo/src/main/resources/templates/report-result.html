<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Date Report</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef7fb;
        }

        .container {
            width: 850px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2384c6;
        }

        .period {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
            font-size: 17px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #f3f9fc;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 12px;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #2384c6;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 18px;
            background: #2384c6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #176fa6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Dental Clinic Report</h1>

    <div class="period">
        Report period:
        <strong th:text="${fromDate}"></strong>
        to
        <strong th:text="${toDate}"></strong>
    </div>

    <div class="grid">

        <div class="card">
            <h3>Total Appointments</h3>
            <div class="value" th:text="${totalAppointments}">0</div>
        </div>

        <div class="card">
            <h3>Scheduled Appointments</h3>
            <div class="value" th:text="${scheduledAppointments}">0</div>
        </div>

        <div class="card">
            <h3>Cancelled Appointments</h3>
            <div class="value" th:text="${cancelledAppointments}">0</div>
        </div>

        <div class="card">
            <h3>Total Bills</h3>
            <div class="value" th:text="${totalBills}">0</div>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <div class="value">
                Rs. <span th:text="${totalRevenue}">0.00</span>
            </div>
        </div>

    </div>

    <div class="buttons">
        <a href="/reports/by-date" class="btn">
            ← Choose Another Date
        </a>

        <a href="/reports" class="btn">
            Back to Reports
        </a>
    </div>

</div>

</body>
</html>l>
