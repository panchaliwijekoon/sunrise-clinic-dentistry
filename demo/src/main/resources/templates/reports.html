<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7fb;
        margin: 0;
    }

    .container {
        width: 800px;
        margin: 60px auto;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        color: #187fbd;
    }

    .reports {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 35px;
    }

    .card {
        padding: 25px;
        background: #f5fbfd;
        border-radius: 12px;
        text-align: center;
    }

    .number {
        font-size: 30px;
        font-weight: bold;
        color: #187fbd;
    }

    .home {
        display: block;
        width: 150px;
        margin: 35px auto 0;
        padding: 12px;
        background: #187fbd;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
    }
    .report-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
    }

    .report-card {
        background: #f3f9fc;
        border-radius: 18px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        transition: 0.2s;
    }

    .report-card:hover {
        transform: translateY(-3px);
    }

    .report-card h3 {
        margin: 10px 0 15px;
        font-size: 20px;
    }

    .report-card p {
        margin: 0;
        font-size: 34px;
        font-weight: bold;
        color: #1984c5;
    }

    .icon {
        font-size: 30px;
    }

    .revenue-card {
        grid-column: span 2;
    }
    .btn {
        display: inline-block;
        padding: 12px 20px;
        background: #2384c6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .btn:hover {
        background: #176fa6;
    }

    @media (max-width: 900px) {
        .report-grid {
            grid-template-columns: 1fr 1fr;
        }

        .revenue-card {
            grid-column: span 2;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Dental Clinic Reports</h1>
    <p>Overview of appointment and billing activity</p>

    <div class="reports">

        <div class="card">
            <h3>Total Appointments</h3>
            <div class="number"
                 th:text="${totalAppointments}"></div>
        </div>

        <div class="card">
            <h3>Scheduled Appointments</h3>
            <div class="number"
                 th:text="${scheduledAppointments}"></div>
        </div>

        <div class="card">
            <h3>Cancelled Appointments</h3>
            <div class="number"
                 th:text="${cancelledAppointments}"></div>
        </div>

        <div class="card">
            <h3>Total Bills</h3>
            <div class="number"
                 th:text="${totalBills}"></div>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>

            <div class="number">
                Rs. <span th:text="${totalRevenue}"></span>
            </div>
        </div>

    </div>

    <a class="home" href="/dashboard">
        Return Home
    </a>
    <div class="report-actions">
        <button class="btn" onclick="window.print()">Print Report</button>
    </div>
    <br>
    <a href="/reports/by-date" class="btn">
        Get Reports by Date
    </a>


</div>

</body>
</html>
