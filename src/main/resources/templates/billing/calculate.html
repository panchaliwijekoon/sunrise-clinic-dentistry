<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculate Bill</title>

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #83cdee;
        }
        .container{
            width: 480px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .h1{
           text-align: center;
            color: #1678b8;
            margin-bottom: 30px;
        }
        label{
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }
        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus{
            outline: none;
            border-color: #1678b8;
        }
        .button-row{
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button, .home-btn{
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        button{
            background: #1678b8;
            color: #fff;
        }
        button:hover, .home-btn:hover{
            background: #d7e1e7;
        }
        home-btn{
            background: #e8eef2;
            color: #333;
        }
        subtitle{
            text-align: center;
            color: #777;
            margin-top: -20px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
<div class="container">
   <p class="sub-title">Sunrise Dental Clinic</p>
<h1>Calculate Bill</h1>

<form th:action="@{/billing/calculate}"  method="post">
    <label for="patientName">Patient Name</label>
    <input type="text" name="patientName" id="patientName" placeholder="Enter Patient Name" required>
    <br>
    <label for="treatment">Treatment</label>
    <input id="treatment" type="text" name="treatment" placeholder="Enter Treatment" required>
    <br>
    <label for="amount">Amount</label>
    <input id="amount" type="text" name="amount" step="0.01" required>
    <br>
    <label for="discount">Discount</label>
    <input id="discount" type="text" name="discount" step="0.01" value="0.00">
    <br>
    <button type="submit">Calculate</button>

</form>
<br>
<a href="/dashboard">Return Home</a>
</div>
</body>
</html>
