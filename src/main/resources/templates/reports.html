<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title><style>
    body {
        font-family: Arial, sans-serif;
        background: #eef7fb;
        margin: 0;
    }

    .container {
        width: 800px;
        margin: 60px auto;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        color: #187fbd;
    }

    .reports {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 35px;
    }

    .card {
        padding: 25px;
        background: #f5fbfd;
        border-radius: 12px;
        text-align: center;
    }

    .number {
        font-size: 30px;
        font-weight: bold;
        color: #187fbd;
    }

    .home {
        display: block;
        width: 150px;
        margin: 35px auto 0;
        padding: 12px;
        background: #187fbd;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Dental Clinic Reports</h1>

    <div class="reports">

        <div class="card">
            <h3>Total Appointments</h3>
            <div class="number"
                 th:text="${totalAppointments}"></div>
        </div>

        <div class="card">
            <h3>Scheduled Appointments</h3>
            <div class="number"
                 th:text="${scheduledAppointments}"></div>
        </div>

        <div class="card">
            <h3>Cancelled Appointments</h3>
            <div class="number"
                 th:text="${cancelledAppointments}"></div>
        </div>

        <div class="card">
            <h3>Total Bills</h3>
            <div class="number"
                 th:text="${totalBills}"></div>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>

            <div class="number">
                Rs. <span th:text="${totalRevenue}"></span>
            </div>
        </div>

    </div>

    <a class="home" href="/dashboard">
        Return Home
    </a>

</div>

</body>
</html>
